# SolarSponge master configuration. All values are design assumptions [A]
# unless a source is named. The config hash is stored with every plan.

# ---------------- time & horizon ----------------
time:
  slot_minutes: 15             # range 5-60; finer = bigger MILP
  horizon_hours: 24            # range 12-48
  replan_every_minutes: 15     # >= slot_minutes
  timezone_display: "Asia/Kolkata"
  timezone_internal: "UTC"

# ---------------- zone (digital twin) ----------------
zone:
  id: "zone-001"
  name: "Rajasthan illustrative feeder"
  lat: 26.9                    # illustrative Rajasthan-like site
  lon: 70.9
  pv_nameplate_kw: 5000
  pv_tilt_deg: 25
  pv_azimuth_deg: 180          # south-facing
  pv_system_losses_pct: 14
  temp_coeff_pct_per_c: -0.4
  evac_limit_frac: 0.35        # sweep 0.3-0.8; set so a clear day shows midday curtailment (stress scenario, not a plant forecast)
  baseline_load_kw_peak: 1200
  baseline_load_noise_pct: 5

# ---------------- weather ----------------
weather:
  provider: "open-meteo"
  cache_ttl_minutes: 30
  history_years: 3
  variables: [ghi, dni, dhi, temperature, cloud_cover, wind, humidity, et0]
  use_synthetic_if_offline: true

# ---------------- forecasting ----------------
forecast:
  quantiles: [0.1, 0.5, 0.9]
  scenario_samples: 200
  pv_load_corr_rho: 0.0
  model: "lightgbm_quantile"   # falls back to empirical quantiles if lightgbm is missing
  lgbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    colsample_bytree: 0.8
  conformal_calibration: true
  backtest:
    train_min_days: 14
    test_window_days: 7
    step_days: 7
  seed: 7

# ---------------- optimizer ----------------
optimizer:
  solver: "cbc"
  time_limit_s: 10
  mip_gap: 0.01
  threads: 2
  warm_start: true
  risk_quantile: 0.4
  weights:
    w_switch: 0.5
    w_late: 0.0
    w_shortfall: 1000.0
  surplus_floor_kw: 30
  fallback: ["incumbent", "greedy", "default_schedule"]

# ---------------- flexible loads ----------------
loads:
  pump_cluster:
    count_clusters: 2
    pumps_per_cluster: 50
    pump_kw: 3.7
    head_m: 30
    wire_to_water_eff: 0.45
    irrigation_eff: 0.7
    area_ha_per_pump: 2
    kc_crop_coeff: 1.0
    max_depletion_mm: 30
    allowed_window: ["06:00", "18:00"]
    min_run_slots: 8
    max_starts_per_day: 2
    default_window: ["06:00", "10:00"]
  cold_store:
    compressor_kw: 200
    temp_band_c: [2.0, 6.0]
    thermal_mass_kwh_per_c: 400
    ua_kw_per_c: 12
    cop: 2.5
    min_run_slots: 4
    max_starts_per_day: 6
    t_init_c: 4.0
  ev_depot:
    vehicles: 30
    charger_kw: 7.4
    battery_kwh: 30
    arrival_soc: 0.3
    target_soc: 0.9
    departure_window: ["05:30", "07:30"]
    charging_eff: 0.92
    default_window: ["20:00", "24:00"]
  hvac_precool:
    flexible_kw: 100
    comfort_band_c: [23.0, 26.0]
    occupancy: ["09:00", "18:00"]
    building_tau_hours: 6
    t_init_c: 24.5
    ua_kw_per_c: 8
    thermal_mass_kwh_per_c: 80

# ---------------- device behaviour (simulation) ----------------
devices:
  response_delay_slots: 1
  noncompliance_prob: 0.05
  telemetry_noise_pct: 2

# ---------------- copilot ----------------
copilot:
  enabled: true
  model_explainer: "claude-haiku-4-5"
  model_whatif: "claude-sonnet-4-5"
  max_tool_calls: 6
  max_output_tokens: 800
  cache_by_plan_id: true
  language_templates: ["en", "hi", "ta"]

# ---------------- evaluation & impact ----------------
evaluation:
  sim_days: 14
  seeds: 5
  bootstrap_resamples: 2000
  weather_classes: [clear, partly_cloudy, overcast, monsoon]
  replay_days: 1

economics:
  # CEA CO2 Baseline Database for the Indian Power Sector, Version 22.0 (August 2026).
  # Table S: weighted average emission factor of the Indian Grid for FY 2025-26
  # (adjusted for cross-border transfers, including RES & captive power): 0.675 tCO2/MWh.
  grid_emission_factor_t_per_mwh: 0.675
  grid_emission_factor_source: "CEA CO2 Baseline Database v22.0, Table S, FY 2025-26 weighted average incl. RES & captive"
  farmer_tariff_discount_per_kwh_inr: 1.0
  baseline_ag_tariff_inr_per_kwh: 0.0

# ---------------- ops ----------------
ops:
  log_level: "INFO"
  metrics_port: 9100
  audit_log: true
  api_rate_limit_per_min: 120
  kill_switch: false
  demo_mode: true
  database_url: "sqlite:///./solarsponge.db"
